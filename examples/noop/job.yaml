protocol: job-spec/1
name: noop
bundle_hash: 54858f6e7d6abbc3d6d40541e044115121a5d68579390b3264d40ee520b0455d
image: ghcr.io/halbritt/runpod-jobrunner-noop@sha256:4abf3fb3eafb070381bb1f8442cebd38a0c966166dfd6d6cd70048b807fcd92e
runner:
  version: 0.1.1
  git_commit: f021b49ee68b61af7f79acdcaae9bb91631a26fa
resources:
  gpu_types:
    - NVIDIA RTX 2000 Ada Generation
  gpu_count: 1
  storage:
    encrypted: true
    mount: /workspace
    required_gb: 10
inputs:
  manifest: input-manifest.json
phases:
  verify:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, verify]
    timeout_seconds: 60
  preflight:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, preflight, --sleep-seconds, '45']
    timeout_seconds: 90
  train:
    enabled: false
    argv: []
    timeout_seconds: 60
  evaluate:
    enabled: false
    argv: []
    timeout_seconds: 60
  package:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, package]
    timeout_seconds: 60
limits:
  max_elapsed_seconds: 600
  max_cost_usd: "0.50"
  usd_per_hour: "0.24"
heartbeat_interval_seconds: 5
termination_grace_seconds: 10
artifacts:
  manifest_path: artifacts/manifest.json
lifecycle:
  delete_after_terminal: true
