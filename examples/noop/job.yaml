protocol: job-spec/1
name: noop
bundle_hash: 8ecccb04afafff5360a6d341a9f1b8ef709fe8458f24949481ee725a5b94898b
image: ghcr.io/halbritt/runpod-jobrunner-noop@sha256:3bf69deb62b02ada937406765087d7ee12b7c78f72c9045463b325ba4214622f
runner:
  version: 0.1.2
  git_commit: cb488a9dbc51209e64490d46b0fa0ef4e5c5ce5a
resources:
  gpu_types:
    - NVIDIA RTX 2000 Ada Generation
  gpu_count: 1
  storage:
    encrypted: true
    mount: /workspace
    required_gb: 10
inputs:
  manifest: input-manifest.json
phases:
  verify:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, verify]
    timeout_seconds: 60
  preflight:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, preflight, --sleep-seconds, '45']
    timeout_seconds: 90
  train:
    enabled: false
    argv: []
    timeout_seconds: 60
  evaluate:
    enabled: false
    argv: []
    timeout_seconds: 60
  package:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, package]
    timeout_seconds: 60
limits:
  max_elapsed_seconds: 600
  max_cost_usd: "0.50"
  usd_per_hour: "0.24"
heartbeat_interval_seconds: 5
termination_grace_seconds: 10
artifacts:
  manifest_path: artifacts/manifest.json
lifecycle:
  delete_after_terminal: true
