protocol: job-spec/1
name: noop
bundle_hash: 087f82073253e5fbabf2a94eed5dfba2c3cdf0641d10d11ec101bce81600eddc
image: ghcr.io/halbritt/runpod-jobrunner-noop@sha256:d6b9f31996c37dc3a627eb3fede9d9a7ae09a86f58108a2ffeeb6a4ea69f6fde
runner:
  version: 0.1.5
  git_commit: cfd725e7eea9cd07aeb2286563fb35d20200705e
resources:
  gpu_types:
    - NVIDIA RTX 2000 Ada Generation
  gpu_count: 1
  storage:
    encrypted: true
    mount: /workspace
    required_gb: 10
inputs:
  manifest: input-manifest.json
phases:
  verify:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, verify]
    timeout_seconds: 60
  preflight:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, preflight, --sleep-seconds, '45']
    timeout_seconds: 90
  train:
    enabled: false
    argv: []
    timeout_seconds: 60
  evaluate:
    enabled: false
    argv: []
    timeout_seconds: 60
  package:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, package]
    timeout_seconds: 60
limits:
  max_elapsed_seconds: 600
  max_cost_usd: "0.50"
  usd_per_hour: "0.24"
heartbeat_interval_seconds: 5
termination_grace_seconds: 10
artifacts:
  manifest_path: artifacts/manifest.json
lifecycle:
  delete_after_terminal: true
