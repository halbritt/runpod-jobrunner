protocol: job-spec/1
name: noop
bundle_hash: 5c5f19cb94a6d92f24710b891d3e4a09b418229c4b5a035afcd0e4d413e25795
image: ghcr.io/halbritt/runpod-jobrunner-noop@sha256:d83de7e79ad5ca1c19ad5cd335ed7f79f9549ecbcae849927cdb40585605594c
runner:
  version: 0.1.6
  git_commit: c682e91186b38e5a1aebc242252fa35ea8a7fcfd
resources:
  gpu_types:
    - NVIDIA RTX 2000 Ada Generation
  gpu_count: 1
  storage:
    encrypted: true
    mount: /workspace
    required_gb: 10
inputs:
  manifest: input-manifest.json
phases:
  verify:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, verify]
    timeout_seconds: 60
  preflight:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, preflight, --sleep-seconds, '45']
    timeout_seconds: 90
  train:
    enabled: false
    argv: []
    timeout_seconds: 60
  evaluate:
    enabled: false
    argv: []
    timeout_seconds: 60
  package:
    enabled: true
    argv: [/opt/runpod-jobrunner/noop, package]
    timeout_seconds: 60
limits:
  max_elapsed_seconds: 600
  max_cost_usd: "0.50"
  usd_per_hour: "0.24"
heartbeat_interval_seconds: 5
termination_grace_seconds: 10
artifacts:
  manifest_path: artifacts/manifest.json
lifecycle:
  delete_after_terminal: true
