name: package-public

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: Exact container package to expose for unauthenticated RunPod pulls
        required: true
        type: choice
        options:
          - runpod-jobrunner-noop
          - striatum-tuner-qwen35b-moe

permissions:
  contents: read
  packages: write

jobs:
  publish-visibility:
    runs-on: ubuntu-24.04
    steps:
      - name: Make the selected no-secret image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          if ! gh api --method PATCH \
            "/user/packages/container/${PACKAGE_NAME}" \
            -f visibility=public; then
            gh api --method PATCH \
              "/users/${OWNER}/packages/container/${PACKAGE_NAME}" \
              -f visibility=public
          fi

      - name: Verify an anonymous registry pull
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          docker logout ghcr.io || true
          docker buildx imagetools inspect \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/${PACKAGE_NAME}:0.1.0"
