name: container

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact semantic version to publish
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish-noop-runner:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the release revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify the release
        run: |
          python3 -m pip install --disable-pip-version-check \
            --require-hashes -r container/requirements-ci.lock
          python3 -m pip install --disable-pip-version-check \
            --no-deps --no-build-isolation .
          uv export --frozen --no-header --no-dev --group build --no-emit-project \
            --output-file /tmp/requirements-runtime.lock
          cmp container/requirements-runtime.lock /tmp/requirements-runtime.lock
          uv export --frozen --no-header --no-dev --extra dev --group build --group ci-tools \
            --no-emit-project --output-file /tmp/requirements-ci.lock
          cmp container/requirements-ci.lock /tmp/requirements-ci.lock
          python3 -m ruff check src tests
          pyright
          python3 -m pytest -q
          python3 -m pip wheel --disable-pip-version-check \
            --no-deps --no-build-isolation --wheel-dir /tmp/wheels .

      - name: Create an attestation-capable BuildKit builder
        run: |
          docker buildx create \
            --driver docker-container \
            --name runpod-jobrunner-publisher \
            --use
          docker buildx inspect --bootstrap

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish the exact version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          container/build-publish.sh --push \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/runpod-jobrunner-noop" \
            "${VERSION}"
