[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "runpod-jobrunner"
version = "0.1.3"
description = "Recoverable, bounded RunPod jobs with a fixed execution protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "jsonschema>=4.23,<5",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "pyright>=1.1.400",
  "ruff>=0.15,<0.16",
]

[dependency-groups]
build = ["setuptools==80.9.0"]
ci-tools = ["uv==0.11.25"]

[project.scripts]
runpod-jobrunner = "runpod_jobrunner.cli:main"
runpod-jobrunner-supervise = "runpod_jobrunner.application:supervisor_main"
runpod-jobrunner-remote = "runpod_jobrunner.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
runpod_jobrunner = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src", "tests"]
